<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="container">
      <h1>User Management System</h1>
      <p class="subtitle">Add, view, edit, and delete registered users.</p>
    </div>
  </header>

  <main class="container">

    <!-- Message banner for success / error feedback -->
    <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

    <!-- Add / Edit User Form -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading" class="card-title">Add User</h2>

      <form id="user-form" novalidate>
        <!-- Hidden field holds the ID of the user being edited. Empty = "add" mode -->
        <input type="hidden" id="user-id" value="" />

        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g. Priya Sharma"
            required
            minlength="2"
            maxlength="100"
          />
          <span class="field-error" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g. priya@example.com"
            required
          />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 9876543210"
            required
            pattern="^\+?[0-9\s\-]{7,15}$"
          />
          <span class="field-error" id="phone-error"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add User</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- User List -->
    <section class="card" aria-labelledby="table-heading">
      <div class="card-header-row">
        <h2 id="table-heading" class="card-title">Registered Users</h2>
        <button id="refresh-btn" class="btn btn-outline" type="button">Refresh</button>
      </div>

      <div class="table-wrapper">
        <table id="user-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone Number</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Rows are inserted here by script.js -->
          </tbody>
        </table>

        <p id="empty-state" class="empty-state" hidden>No users yet. Add your first user above.</p>
        <p id="loading-state" class="loading-state" hidden>Loading users...</p>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>User Management System &mdash; built with HTML, CSS, JavaScript, Node.js, Express &amp; MySQL</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
